<div class="layout">
    <app-navbar (onMenuClick)="toggleSidebar()"></app-navbar>
    <div class="layout-container">
        <app-sidebar [open]="sidebarOpen" (onClose)="closeSidebar()"></app-sidebar>
        <main class="layout-main" (scroll)="onMainScroll($event)">
            <router-outlet></router-outlet>
        </main>
    </div>
    <app-footer [class.visible]="showFooter"></app-footer>
</div>
