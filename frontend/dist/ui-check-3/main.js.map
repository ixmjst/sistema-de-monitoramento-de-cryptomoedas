<div class="language-switch">
    <button class="lang-btn" [ngClass]="{ active: currentLanguage === lang.code }" *ngFor="let lang of languages"
        (click)="changeLanguage(lang.code)" [title]="lang.label">
        <span class="lang-code">{{ lang.code.toUpperCase() }}</span>
        <span class="lang-label">{{ lang.label }}</span>
    </button>
</div>
