<div class="export-container">
  <div class="page-header">
    <h1>{{ 'nav.export' | translate }}</h1>
    <p class="text-muted">{{ 'export.subtitle' | translate }}</p>
  </div>

  <div class="export-options">
    <div class="export-card card">
      <div class="export-icon">CSV</div>
      <h2>{{ 'export.csvTitle' | translate }}</h2>
      <p class="text-muted">{{ 'export.csvText' | translate }}</p>
      <button class="btn btn-primary btn-lg" (click)="exportCSV()" [disabled]="exporting">
        <span *ngIf="!exporting">{{ 'export.downloadCsv' | translate }}</span>
        <span *ngIf="exporting">{{ 'common.loading' | translate }}</span>
      </button>
    </div>

    <div class="export-card card">
      <div class="export-icon">PDF</div>
      <h2>{{ 'export.pdfTitle' | translate }}</h2>
      <p class="text-muted">{{ 'export.pdfText' | translate }}</p>
      <button class="btn btn-primary btn-lg" (click)="exportPDF()" [disabled]="exporting">
        <span *ngIf="!exporting">{{ 'export.downloadPdf' | translate }}</span>
        <span *ngIf="exporting">{{ 'common.loading' | translate }}</span>
      </button>
    </div>
  </div>
</div>
