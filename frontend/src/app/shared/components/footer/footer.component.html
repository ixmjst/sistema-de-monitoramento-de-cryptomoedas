<footer class="footer">
    <div class="footer-container">
        <div class="footer-main">
            <div class="footer-brand">
                <h4>CryptoMonitor</h4>
                <p>Sistema profissional de monitoramento de criptomoedas em tempo real.</p>
            </div>

            <div class="footer-actions">
                <div class="footer-links">
                    <span>Links úteis:</span>
                    <ng-container *ngFor="let link of footerLinks; let last = last">
                        <a [href]="link.url">{{ link.label }}</a>
                        <span *ngIf="!last" class="link-separator">•</span>
                    </ng-container>
                </div>

                <div class="social-links">
                    <a href="#" class="social-link" title="Twitter">𝕏</a>
                    <a href="#" class="social-link" title="LinkedIn">in</a>
                    <a href="#" class="social-link" title="GitHub">gh</a>
                    <a href="#" class="social-link" title="Discord">dc</a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; {{ currentYear }} CryptoMonitor. Todos os direitos reservados.</p>
            <p class="footer-credit">feito por ixmjst👾</p>
        </div>
    </div>
</footer>
