<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <button class="navbar-toggle" (click)="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a class="navbar-logo" routerLink="/">
                <span class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 12L10 6L14 10L20 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M4 20L10 14L14 18L20 12" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="logo-text">CryptoMonitor</span>
            </a>
        </div>

        <div class="navbar-search">
            <input type="text" class="search-input" placeholder="Buscar criptomoedas..." [(ngModel)]="searchQuery"
                (keyup.enter)="onSearch()" />
            <button class="search-btn" (click)="onSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
        </div>

        <div class="navbar-actions">
            <app-theme-switch></app-theme-switch>
            <app-language-switch></app-language-switch>

            <div class="navbar-user" *ngIf="user$ | async as user">
                <span class="user-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 12.5c2.485 0 4.5-2.015 4.5-4.5S14.485 3.5 12 3.5 7.5 5.515 7.5 8 9.515 12.5 12 12.5Z"
                            stroke="currentColor" stroke-width="1.8" />
                        <path d="M4.5 20.5c0-3.315 2.685-6 6-6s6 2.685 6 6" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <span class="user-name">{{ user.name }}</span>
            </div>

            <button class="btn btn-primary btn-sm" (click)="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                {{ 'common.logout' | translate }}
            </button>
        </div>
    </div>
</nav>
