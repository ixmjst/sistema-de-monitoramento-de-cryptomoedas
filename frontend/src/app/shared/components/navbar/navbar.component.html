<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <a class="navbar-logo" routerLink="/dashboard">
                <span class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L3.5 7v10L12 22l8.5-5V7L12 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                        <path d="M7 15.5v-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        <path d="M10.5 15.5V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        <path d="M14 15.5V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        <circle cx="17.5" cy="7" r="1.5" fill="currentColor" />
                        <path d="M7 12c1.5-1.5 2.5-2.5 3.5-2.5s2.5-2.5 3.5-2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" />
                    </svg>
                </span>
                <span class="logo-text">CryptoMonitor</span>
            </a>
        </div>

        <!-- Main Navigation Menu (desktop) -->
        <nav class="navbar-nav" *ngIf="user$ | async">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }" title="Painel">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 20h16"/><path d="M8 16V10"/><path d="M12 16V6"/><path d="M16 16V13"/>
                </svg>
                <span>Painel</span>
            </a>
            <a class="nav-link" routerLink="/cryptocurrencies" routerLinkActive="active" title="Criptomoedas">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="7"/><path d="M8 12h8"/><path d="M12 8v8"/>
                </svg>
                <span>Criptomoedas</span>
            </a>
            <a class="nav-link" routerLink="/favorites" routerLinkActive="active" title="Favoritos">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M6 4h12v16l-6-4-6 4V4Z"/>
                </svg>
                <span>Favoritos</span>
                <span class="nav-badge" *ngIf="favoriteCount > 0">{{ favoriteCount > 99 ? '99+' : favoriteCount }}</span>
            </a>
            <a class="nav-link" routerLink="/history" routerLinkActive="active" title="Histórico">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 12a8 8 0 1 1 8 8"/><path d="M12 4v8h8"/>
                </svg>
                <span>Histórico</span>
            </a>
            <a class="nav-link" routerLink="/portfolio" routerLinkActive="active" title="Portfólio">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                </svg>
                <span>Portfólio</span>
            </a>
            <a class="nav-link" routerLink="/export" routerLinkActive="active" title="Exportar">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 21h16"/>
                </svg>
                <span>Exportar</span>
            </a>
            <a class="nav-link nav-link--admin" routerLink="/admin" routerLinkActive="active" *ngIf="isAdmin" title="Admin">
                <svg viewBox="0 0 24 24" fill="none" width="16" height="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3l7 3v5c0 4.5-2.8 8.4-7 10c-4.2-1.6-7-5.5-7-10V6l7-3Z"/>
                    <path d="M9 12l2 2l4-4"/>
                </svg>
                <span>Admin</span>
            </a>
        </nav>

        <div class="navbar-search">
            <input type="text" class="search-input" [placeholder]="'common.searchPlaceholder' | translate"
                [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" />
            <button class="search-btn" (click)="onSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
        </div>

        <div class="navbar-actions" *ngIf="user$ | async as user; else guestActions">
            <app-theme-switch></app-theme-switch>
            <app-language-switch></app-language-switch>

            <div class="navbar-user">
                <span class="user-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 12.5c2.485 0 4.5-2.015 4.5-4.5S14.485 3.5 12 3.5 7.5 5.515 7.5 8 9.515 12.5 12 12.5Z"
                            stroke="currentColor" stroke-width="1.8" />
                        <path d="M4.5 20.5c0-3.315 2.685-6 6-6s6 2.685 6 6" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" />
                    </svg>
                </span>
                <span class="user-name">{{ user.name }}</span>
            </div>

            <!-- Hamburger (mobile only) -->
            <button class="navbar-hamburger" (click)="toggleMobileMenu()" [class.open]="mobileMenuOpen"
                aria-label="Menu">
                <span></span><span></span><span></span>
            </button>

            <button class="navbar-logout-btn" (click)="logout()" title="Sair" aria-label="Sair">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>

        <ng-template #guestActions>
            <div class="navbar-actions navbar-actions-guest">
                <app-theme-switch></app-theme-switch>
                <app-language-switch></app-language-switch>
                <a routerLink="/auth/login" class="btn btn-secondary btn-sm">{{ 'common.login' | translate }}</a>
                <a routerLink="/auth/register" class="btn btn-primary btn-sm">{{ 'common.register' | translate }}</a>
            </div>
        </ng-template>
    </div>

    <!-- Mobile drawer menu -->
    <div class="mobile-menu" [class.open]="mobileMenuOpen" *ngIf="(user$ | async) && mobileMenuOpen">
        <a class="mobile-nav-link" routerLink="/dashboard" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 20h16"/><path d="M8 16V10"/><path d="M12 16V6"/><path d="M16 16V13"/>
            </svg>
            Painel
        </a>
        <a class="mobile-nav-link" routerLink="/cryptocurrencies" routerLinkActive="active" (click)="closeMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="7"/><path d="M8 12h8"/><path d="M12 8v8"/>
            </svg>
            Criptomoedas
        </a>
        <a class="mobile-nav-link" routerLink="/favorites" routerLinkActive="active" (click)="closeMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 4h12v16l-6-4-6 4V4Z"/>
            </svg>
            Favoritos
            <span class="mobile-badge" *ngIf="favoriteCount > 0">{{ favoriteCount }}</span>
        </a>
        <a class="mobile-nav-link" routerLink="/history" routerLinkActive="active" (click)="closeMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 12a8 8 0 1 1 8 8"/><path d="M12 4v8h8"/>
            </svg>
            Histórico
        </a>
        <a class="mobile-nav-link" routerLink="/portfolio" routerLinkActive="active" (click)="closeMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
            Portfólio
        </a>
        <a class="mobile-nav-link" routerLink="/export" routerLinkActive="active" (click)="closeMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 21h16"/>
            </svg>
            Exportar
        </a>
        <a class="mobile-nav-link mobile-nav-link--admin" routerLink="/admin" routerLinkActive="active"
           *ngIf="isAdmin" (click)="closeMobileMenu()">
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3l7 3v5c0 4.5-2.8 8.4-7 10c-4.2-1.6-7-5.5-7-10V6l7-3Z"/>
            </svg>
            Admin
        </a>
    </div>
    <div class="mobile-overlay" *ngIf="mobileMenuOpen" (click)="closeMobileMenu()"></div>
</nav>
