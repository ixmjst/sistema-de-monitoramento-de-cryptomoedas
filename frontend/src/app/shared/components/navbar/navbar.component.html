<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <button class="navbar-toggle" (click)="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a class="navbar-logo" href="/">
                <span class="logo-icon">💰</span>
                <span class="logo-text">CryptoMonitor</span>
            </a>
        </div>

        <div class="navbar-search">
            <input type="text" class="search-input" placeholder="Buscar criptomoedas..." [(ngModel)]="searchQuery"
                (keyup.enter)="onSearch()" />
            <button class="search-btn" (click)="onSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
        </div>

        <div class="navbar-actions">
            <app-theme-switch></app-theme-switch>
            <app-language-switch></app-language-switch>

            <div class="navbar-user" *ngIf="user$ | async as user">
                <img [src]="'https://i.pravatar.cc/40?u=' + user.email" [alt]="user.name" class="user-avatar" />
                <span class="user-name">{{ user.name }}</span>
            </div>

            <button class="btn btn-primary btn-sm" (click)="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                {{ 'common.logout' | translate }}
            </button>
        </div>
    </div>
</nav>
