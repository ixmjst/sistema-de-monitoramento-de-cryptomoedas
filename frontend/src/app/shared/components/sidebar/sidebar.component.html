<aside class="sidebar" [class.sidebar-open]="open">
    <button class="sidebar-close" (click)="closeSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <nav class="sidebar-nav">
        <div class="nav-section">
            <h3 class="nav-title">Menu Principal</h3>
            <ul class="nav-list">
                <li *ngFor="let item of menuItems" class="nav-item">
                    <button class="nav-link" (click)="navigate(item.route)">
                        <span class="nav-icon" [ngSwitch]="item.icon">
                            <svg *ngSwitchCase="'dashboard'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 20h16" />
                                <path d="M8 16V10" />
                                <path d="M12 16V6" />
                                <path d="M16 16V13" />
                            </svg>
                            <svg *ngSwitchCase="'crypto'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="7" />
                                <path d="M8 12h8" />
                                <path d="M12 8v8" />
                            </svg>
                            <svg *ngSwitchCase="'favorites'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 4h12v16l-6-4-6 4V4Z" />
                            </svg>
                            <svg *ngSwitchCase="'history'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 12a8 8 0 1 1 8 8" />
                                <path d="M12 4v8h8" />
                            </svg>
                            <svg *ngSwitchCase="'export'" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 3v12" />
                                <path d="M8 11l4 4 4-4" />
                                <path d="M4 21h16" />
                            </svg>
                        </span>
                        <span class="nav-label">{{ item.label }}</span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="sidebar-footer">
        <button class="sidebar-logout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
        </button>
    </div>
</aside>

<div class="sidebar-overlay" *ngIf="open" (click)="closeSidebar()"></div>
