<button 
  class="scroll-to-top-btn"
  *ngIf="isVisible"
  (click)="scrollToTop()"
  title="Voltar ao topo"
  [attr.aria-label]="'Voltar ao topo'"
>
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M12 19V6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6.5 11.5L12 6l5.5 5.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
