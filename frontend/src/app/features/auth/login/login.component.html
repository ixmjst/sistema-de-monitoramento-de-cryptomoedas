<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>{{ 'auth.login' | translate }}</h1>
      <p class="text-muted">{{ 'title' | translate }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">{{ 'auth.email' | translate }}</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          [class.error]="email?.invalid && email?.touched"
          placeholder="seu@email.com"
        />
        <span class="error-message" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required</span>
          <span *ngIf="email?.errors?.['email']">Invalid email format</span>
        </span>
      </div>

      <div class="form-group">
        <label for="password">{{ 'auth.password' | translate }}</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          [class.error]="password?.invalid && password?.touched"
          placeholder="••••••••"
        />
        <span class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </span>
      </div>

      <div class="error-alert" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary btn-lg" [disabled]="loading || loginForm.invalid">
        <span *ngIf="!loading">{{ 'auth.login' | translate }}</span>
        <span *ngIf="loading">{{ 'common.loading' | translate }}</span>
      </button>

      <div class="auth-footer">
        <p>
          Don't have an account?
          <a routerLink="/auth/register">{{ 'auth.register' | translate }}</a>
        </p>
      </div>
    </form>
  </div>
</div>
