<div class="auth-container">
  <div class="auth-card">
    <h1>Nova Senha</h1>
    <p class="subtitle">Defina a sua nova senha de acesso.</p>

    <div class="success-message" *ngIf="success">
      <p>✓ Senha redefinida com sucesso! Redirecionando para o login...</p>
    </div>

    <div class="error-message" *ngIf="error && !success">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!success && token">
      <div class="form-group">
        <label for="password">Nova Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          [class.invalid]="password?.invalid && password?.touched"
        />
        <span class="field-error" *ngIf="password?.errors?.['minlength'] && password?.touched">
          Mínimo 6 caracteres
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Repita a senha"
          [class.invalid]="confirmPassword?.invalid && confirmPassword?.touched"
        />
        <span class="field-error" *ngIf="confirmPassword?.errors?.['passwordMismatch'] && confirmPassword?.touched">
          As senhas não coincidem
        </span>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading || form.invalid">
        {{ loading ? 'Salvando...' : 'Redefinir senha' }}
      </button>

      <div class="auth-links">
        <a routerLink="/auth/login">Voltar ao login</a>
      </div>
    </form>
  </div>
</div>
