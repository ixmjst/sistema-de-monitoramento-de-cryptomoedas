<div class="auth-container">
  <div class="auth-card">
    <h1>{{ 'auth.forgotPasswordTitle' | translate }}</h1>
    <p class="subtitle">{{ 'auth.forgotPasswordSubtitle' | translate }}</p>

    <div class="success-message" *ngIf="success">
      <p>✓ {{ 'auth.forgotPasswordSuccess' | translate }}</p>
      <a routerLink="/auth/login" class="btn btn-primary">{{ 'auth.backToLogin' | translate }}</a>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div class="form-group">
        <label for="email">{{ 'auth.email' | translate }}</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          [placeholder]="'auth.emailPlaceholder' | translate"
          [class.invalid]="email?.invalid && email?.touched"
        />
        <span class="field-error" *ngIf="email?.invalid && email?.touched">
          {{ 'auth.emailInvalid' | translate }}
        </span>
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-primary" [disabled]="loading || form.invalid">
        {{ loading ? ('auth.sending' | translate) : ('auth.sendCode' | translate) }}
      </button>

      <div class="auth-links">
        <a routerLink="/auth/login">{{ 'auth.backToLogin' | translate }}</a>
      </div>
    </form>
  </div>
</div>
