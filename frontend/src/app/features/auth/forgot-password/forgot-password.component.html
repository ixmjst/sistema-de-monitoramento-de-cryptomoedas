<div class="auth-container">
  <div class="auth-card">
    <h1>Recuperar Senha</h1>
    <p class="subtitle">Insira o seu e-mail e enviaremos um código de recuperação.</p>

    <div class="success-message" *ngIf="success">
      <p>✓ E-mail enviado! Verifique a sua caixa de entrada.</p>
      <a routerLink="/auth/login" class="btn btn-primary">Voltar ao login</a>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          [class.invalid]="email?.invalid && email?.touched"
        />
        <span class="field-error" *ngIf="email?.invalid && email?.touched">
          E-mail inválido
        </span>
      </div>

      <div class="error-message" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-primary" [disabled]="loading || form.invalid">
        {{ loading ? 'Enviando...' : 'Enviar código' }}
      </button>

      <div class="auth-links">
        <a routerLink="/auth/login">Voltar ao login</a>
      </div>
    </form>
  </div>
</div>
